spring.application.name=campus-rent
spring.config.import=optional:file:./config/application-local.properties

# SID syntax, not a service-name URL. Supply values locally or via environment.
spring.datasource.url=jdbc:oracle:thin:@${ORACLE_HOST}:${ORACLE_PORT}:${ORACLE_SID}
spring.datasource.username=${ORACLE_USERNAME}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.data-source-properties.oracle.net.CONNECT_TIMEOUT=10000
spring.datasource.hikari.data-source-properties.oracle.jdbc.ReadTimeout=15000

# Never create/rename ERD objects or run seed data implicitly.
spring.sql.init.mode=never

# The existing UI is a local demo; server authentication is a separate task.
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.jackson.deserialization.fail-on-trailing-tokens=true
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.kr.ac.campusrent=INFO
